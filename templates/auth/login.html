{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block body %}
  <div class="d-grid h-100" style="place-items: center; background-color: var(--gray-100);">
    <div class="w-100" style="max-width: 500px">
      {% if error %}
      <div class="alert alert-danger" role="alert">
        <ul class="m-0">
          <li>{{ error }}</li>
        </ul>
      </div>
      {% endif %}

      <div class="d-grid h-100" style="place-items: center;">
        {% if success %}
        <div class="alert alert-success" role="alert">
          <ul class="m-0">
            <li>{{ success }}</li>
          </ul>
        </div>
        {% endif %}
      </div>

      <div class="w-100 bg-white px-5 py-4 rounded-3 shadow">
        <h2 class="text-center fw-bold mb-2" style="color: var(--primary-color);">Quiz Master</h2>
        <h4 class="text-center text-secondary mb-4">Sign In</h4>
        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="mb-4">
            <label for="username" class="form-label fw-medium">Username</label>
            <input type="text" name="username" id="username" class="form-control" required/>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-medium">Password</label>
            <input type="password" name="password" id="password" class="form-control" required/>
          </div>
          <div class="d-flex mt-4">
            <button type="submit" class="btn btn-primary col-6">Login</button>
            <a href="/register" class="btn btn-link col-6 text-decoration-none">Create new user?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
