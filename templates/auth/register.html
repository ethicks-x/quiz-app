{% extends 'base.html' %}

{% block title %} Register {% endblock %}

{% block body %}
  <div class="d-grid h-100" style="place-items: center; background-color: var(--gray-100);">
    <div class="w-100" style="max-width: 500px">
      {% if error %}
      <div class="alert alert-danger" role="alert">
        <ul class="m-0">
          <li>{{ error }}</li>
        </ul>
      </div>
      {% endif %}

      <div class="w-100 bg-white px-5 py-4 rounded-3 shadow">
        <h2 class="text-center fw-bold mb-2" style="color: var(--primary-color);">Quiz Master</h2>
        <h4 class="text-center text-secondary mb-4">Create Account</h4>
        <form action="/register" method="post">
          <div class="mb-3">
            <label for="username" class="form-label fw-medium"> Username </label>
            <input type="text" name="username" id="username" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-medium"> Password </label>
            <input type="password" name="password" id="password" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="full_name" class="form-label fw-medium"> Full Name </label>
            <input type="text" name="full_name" id="full_name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="qualification" class="form-label fw-medium"> Qualification </label>
            <input type="text" name="qualification" id="qualification" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="dob" class="form-label fw-medium"> Date of Birth </label>
            <input type="date" name="dob" id="dob" class="form-control" required />
          </div>
          <div class="d-flex mt-4">
            <button type="submit" class="btn btn-primary col-6"> Register </button>
            <a href="/login" class="btn btn-link col-6 text-decoration-none"> Existing user? </a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
